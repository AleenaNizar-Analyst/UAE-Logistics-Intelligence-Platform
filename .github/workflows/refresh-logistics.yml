name: Refresh UAE Logistics Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Fetch and validate UAE route data
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python main.py

      - name: Commit updated route data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uae_routes_cleaned.json
          git diff --cached --quiet || git commit -m "Automated UAE route data refresh"
          git push
